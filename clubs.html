<!-- Le thème est posé AVANT le premier rendu : lu depuis le script principal,
     la page clignoterait en sombre puis basculerait en clair. -->
<script>
  try {
    var m = localStorage.getItem("kd1-theme");
    if (m) document.documentElement.dataset.theme = m;
  } catch (e) {}

  /* Filet de sécurité, en script CLASSIQUE et non en module — c'est justement
     un module qui peut échouer, et un module qui ne se lie pas n'exécute rien :
     ni rendu, ni gestionnaire d'erreur, écran noir. Ce script-ci est dans le
     HTML, toujours revalidé, donc toujours à jour.

     Il ne répare rien : il dit ce qui s'est passé et propose le seul geste qui
     règle le cas — un rechargement qui contourne le cache. */
  (function () {
    var cassé = false;
    addEventListener("error", function (e) {
      if (e.target && e.target.tagName === "SCRIPT") cassé = true;
      else if (e.message) cassé = true;
    }, true);
    addEventListener("unhandledrejection", function () { cassé = true; });

    addEventListener("load", function () {
      setTimeout(function () {
        var hôte = document.getElementById("main");
        if (!hôte || (!cassé && hôte.childElementCount)) return;
        if (hôte.childElementCount) return;
        var en = (document.documentElement.lang || "fr").indexOf("en") === 0;
        hôte.innerHTML = "";
        var box = document.createElement("div");
        box.style.cssText = "max-width:46rem;margin:12vh auto;padding:0 24px;" +
          "font:15px/1.6 system-ui,sans-serif;color:#e9efea";
        var h = document.createElement("h1");
        h.style.cssText = "font-size:1.5rem;margin:0 0 12px";
        h.textContent = en ? "This page could not load"
                           : "Cette page n’a pas pu se charger";
        var p = document.createElement("p");
        p.style.cssText = "color:#a3b3aa;margin:0 0 20px";
        p.textContent = en
          ? "A stale file is cached in your browser. Reloading fixes it."
          : "Un fichier périmé est resté en cache dans le navigateur. "
            + "Recharger suffit à le corriger.";
        var b = document.createElement("button");
        b.style.cssText = "font:inherit;text-transform:uppercase;letter-spacing:" +
          ".06em;padding:10px 18px;border-radius:8px;border:0;cursor:pointer;" +
          "background:#f2c14e;color:#1a1405";
        b.textContent = en ? "Reload" : "Recharger";
        b.onclick = function () {
          location.replace(location.pathname + location.search
            + (location.search ? "&" : "?") + "_r=" + Date.now());
        };
        box.appendChild(h); box.appendChild(p); box.appendChild(b);
        hôte.appendChild(box);
      }, 1200);
    });
  })();
</script>
<script type="module" src="assets/ab066d172b/js/pages/clubs.js"></script>
</head>
<body>
<main id="main"></main>
</body>
</html>
