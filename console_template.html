function renderPromptCard(m) {
  const card = el("div", "card");
  card.appendChild(el("h2", null, t("Contenu Instagram")));
  card.appendChild(el("p", "sub", t(
    "Génère un brief prêt à coller dans Claude pour produire le carrousel de " +
    "4 slides. Toutes les valeurs sont tirées de cette fiche — le brief interdit " +
    "explicitement d'en inventer et exclut tout pronostic.")));

  const row = el("div", "btnrow");
  const gen = el("button", "btn primary", t("Générer le prompt"));
  gen.type = "button";
  const copy = el("button", "btn", t("Copier"));
  copy.type = "button";
  copy.style.display = "none";
  const said = el("span", "copied");
  row.appendChild(gen);
  row.appendChild(copy);
  row.appendChild(said);
  card.appendChild(row);

  const box = el("div", "promptbox");
  box.style.display = "none";
  const area = el("textarea");
  area.readOnly = true;
  area.spellcheck = false;
  box.appendChild(area);
  card.appendChild(box);

  gen.addEventListener("click", () => {
    area.value = buildPrompt(m);
    box.style.display = "";
    copy.style.display = "";
    said.textContent = "";
    area.scrollTop = 0;
  });

  copy.addEventListener("click", async () => {
    // navigator.clipboard n'existe pas toujours en file:// : on garde la
    // sélection + execCommand en secours pour que le bouton marche partout.
    try {
      await navigator.clipboard.writeText(area.value);
    } catch (e) {
      area.removeAttribute("readonly");
      area.select();
      document.execCommand("copy");
      area.readOnly = true;
    }
    said.textContent = t("copié");
    setTimeout(() => { said.textContent = ""; }, 2000);
  });

  return card;
}

/* ---------- rencontres : liste, filtres, sélection ---------- */
const state = { team: "", scope: "upcoming", matchId: null };

const dayOf = f => (f.kickoff || "").split(" ")[0] || "";
const detailFor = id => DATA.matches.find(m => m.match_id === id) || null;

function visibleFixtures() {
  return (DATA.fixtures || []).filter(f => {
    if (state.team && f.home !== state.team && f.away !== state.team) return false;
    if (state.scope === "upcoming") return !f.played;
    if (state.scope === "played") return f.played;
    if (state.scope === "today") return dayOf(f) === DATA.today;
    return true;
  });
}

function fixtureRow(f) {
  const has = !!detailFor(f.match_id);
  // Une rencontre sans fiche récupérée reste listée — on la montre, sans
  // prétendre qu'on peut l'ouvrir.
  const row = el(has ? "button" : "div", "fx");
  if (has) {
    row.type = "button";
    row.setAttribute("aria-current", String(f.match_id === state.matchId));
    row.addEventListener("click", () => { state.matchId = f.match_id; renderAll(); });
  }

  const when = el("div", "when");
  // Un match en cours montre son score comme un match joué, mais signalé : le
  // chiffre n'est pas définitif, et il peut encore être corrigé par la source.
  if (f.live && f.score) when.appendChild(el("span", "sc live", f.score));
  else if (f.played && f.score) when.appendChild(el("span", "sc", f.score));
  else when.appendChild(el("span", null, (f.kickoff || "").split(" ")[1] || "—"));
  row.appendChild(when);

  const who = el("div", "who");
  who.appendChild(teamLabel(f.home, "sm"));
  who.appendChild(el("span", "sep", "—"));
  who.appendChild(teamLabel(f.away, "sm"));
  if (f.live) who.appendChild(el("span", "badge live", t("en direct")));
  else if (dayOf(f) === DATA.today && !f.played) who.appendChild(el("span", "badge", t("aujourd'hui")));
  // Le numéro de journée vient de Sofascore : ni Forebet ni Flashscore ne le
  // donnent sur cette division, et sans lui la liste n'est qu'une suite de
  // dates.
  if (f.round) who.appendChild(el("span", "badge round", "J" + f.round));
  // La chaîne n'apparaît dans la liste que si elle a été renseignée : afficher
  // « habituellement… » sur chaque ligne serait du bruit.
  if (f.broadcast && f.broadcast.confirmed) {
    who.appendChild(el("span", "badge", f.broadcast.channel));
  }
  row.appendChild(who);

  // Trois états distincts : fiche disponible, rencontre simplement inscrite au
  // calendrier (Flashscore, trop lointaine pour que Forebet la détaille), ou
  // fiche que la collecte n'a pas ramenée.
  row.appendChild(el("div", "go", t(
    has ? "voir les stats ›"
        : f.source === "flashscore" ? "au calendrier"
        : "fiche non récupérée")));
  return row;
}

function renderFixtures() {
  const host = document.getElementById("fixtures");
  host.textContent = "";
  const card = el("div", "card");
  card.appendChild(el("h2", null, t("Rencontres")));
  const loin = (DATA.fixtures || []).filter(f => f.source === "flashscore").length;
  card.appendChild(el("p", "sub", ph("fixturesNote", loin, DATA.today)));

  const list = visibleFixtures();
  if (!list.length) {
    card.appendChild(el("div", "empty", t("Aucune rencontre pour ce filtre.")));
  } else {
    let day = null;
    list.forEach(f => {
      const d = dayOf(f);
      if (d !== day) {
        day = d;
        card.appendChild(el("div", "daylabel", d === DATA.today ? ph("dayToday", d) : d));
      }
      card.appendChild(fixtureRow(f));
    });
  }
  host.appendChild(card);
}

function renderDetail() {
  const app = document.getElementById("app");
  app.textContent = "";
  const m = detailFor(state.matchId);
  if (!m) {
    const card = el("div", "card");
    card.appendChild(el("div", "empty",
      t("Choisis une rencontre ci-dessus pour afficher les statistiques des deux équipes.")));
    app.appendChild(card);
    document.title = t("Console Forebet");
    return;
  }
  // Le classement part dans une colonne collante à droite : c'est la référence
  // qu'on veut garder sous les yeux en parcourant les stats.
  const layout = el("div", "layout");
  const main = el("div", "main");
  const side = el("div", "side");

  main.appendChild(renderHead(m));
  main.appendChild(renderPromptCard(m));
  // Le relevé du match passe avant les agrégats de saison : quand il existe,
  // c'est l'information la plus concrète de la page.
  const live = renderMatchStats(m);
  if (live) main.appendChild(live);
  main.appendChild(renderIdentity(m));
  main.appendChild(renderCompare(m));
  main.appendChild(renderRuns(m));
  main.appendChild(renderContext(m));
  const squads = renderSquads(m);
  if (squads) main.appendChild(squads);
  side.appendChild(renderStandings(m));

  layout.appendChild(main);
  layout.appendChild(side);
  app.appendChild(layout);
  document.title = `${m.home} - ${m.away} · ${t("Console Forebet")}`;
}

function renderAll() {
  // Si la sélection courante sort du filtre, on bascule sur la première
  // rencontre visible qui a une fiche plutôt que de laisser un détail orphelin.
  const list = visibleFixtures();
  if (!list.some(f => f.match_id === state.matchId && detailFor(f.match_id))) {
    const first = list.find(f => detailFor(f.match_id));
    state.matchId = first ? first.match_id : null;
  }
  renderFixtures();
  renderDetail();
  // Une rencontre qui entre dans sa fenêtre allume le direct toute seule : la
  // console reste ouverte des heures, on ne va pas demander un rechargement.
  syncLive();
}

function fillTeamSelect() {
  const teams = [...new Set((DATA.fixtures || []).flatMap(f => [f.home, f.away]))]
    .filter(Boolean).sort((a, b) => a.localeCompare(b, "fr"));
  const sel = document.getElementById("team");
  sel.textContent = "";
  sel.appendChild(el("option", null, t("Toutes les équipes")));
  sel.lastChild.value = "";
  teams.forEach(name => {
    const o = el("option", null, name);
    o.value = name;
    sel.appendChild(o);
  });
  // Après un rafraîchissement, on garde le filtre en cours — sauf si l'équipe
  // a disparu des rencontres, auquel cas le laisser afficherait une liste vide.
  if (state.team && !teams.includes(state.team)) state.team = "";
  sel.value = state.team;
}

function renderFoot() {
  document.getElementById("foot").textContent = ph("foot", DATA.generated);
}

/* Tout ce que la barre du haut affiche en dur. Rappelé à chaque bascule de

function renderChrome() {

function setLang(next) {
  lang = next;
  try { localStorage.setItem("console-lang", next); } catch (e) { /* mode privé */ }
  renderChrome();
  fillTeamSelect();

  renderAll();

/* ---------- direct ---------- */
/* La page ne va JAMAIS chercher Forebet elle-même — elle ne le peut pas, il n'y
   a pas de CORS. Elle interroge `serve.py`, qui tient un fil de fond relevant
   les matchs en cours une fois par minute. On peut donc l'interroger souvent
   sans rien coûter à la source : on lit un instantané déjà pris.

   Deux limites de la source, constatées le 10/08/2026 en cours de match et
   assumées par l'affichage :

   - ni minute ni statut, et aucun fait de jeu avant la fin : on date le relevé,
     on n'affiche pas d'horloge de match qu'on n'a pas ;
   - le score des premières minutes peut être réattribué d'un camp à l'autre.
     Le serveur marque ces rencontres `unstable`, et la carte le dit. */

const LIVE_BEFORE_MS = 5 * 60000;    // même fenêtre que serve.py
const LIVE_AFTER_MS = 150 * 60000;
/* On interroge le serveur plus souvent qu'il ne relève : c'est gratuit, et le
   relevé s'affiche ainsi dans les secondes qui suivent sa prise. */
const LIVE_EVERY_MS = 15000;

let liveTimer = null;
let liveSnapshot = null;
/* `null` = l'utilisateur n'a rien choisi ; on décide alors pour lui (voir
   `liveWanted`). Une fois qu'il a cliqué, son choix prime et il est retenu. */
let liveChoice = (() => {
  try {
    const v = localStorage.getItem("console-live");
    return v === null ? null : v === "1";
  } catch (e) { return null; }
})();

/* Les rencontres qui devraient être en train de se jouer, d'après l'heure. Les
   dates sans fuseau sont lues en heure locale, exactement comme côté Python. */
function liveFixtures() {
  const now = Date.now();
  return (DATA.fixtures || []).filter(f => {
    if (!f.match_id || !f.kickoff_iso) return false;
    const ko = Date.parse(f.kickoff_iso);
    return isFinite(ko) && now >= ko - LIVE_BEFORE_MS && now <= ko + LIVE_AFTER_MS;
  });
}

/* Par défaut, on suit : si une rencontre se joue pendant qu'on regarde la
   console, c'est ce qu'on est venu voir. Le bouton permet de couper, et ce
   refus-là est retenu. En file://, personne à interroger. */
function liveWanted() {
  if (location.protocol === "file:") return false;
  if (!liveFixtures().length) return false;
  return liveChoice === null ? true : liveChoice;
}

function setLive(on, why) {
  liveChoice = on;
  try { localStorage.setItem("console-live", on ? "1" : "0"); } catch (e) { /* mode privé */ }
  if (why) note(why);
  syncLive();
}

/* Démarre ou arrête la boucle selon ce que veut l'utilisateur et ce que dit
   l'horloge. Appelée après chaque rendu : une rencontre qui entre dans sa
   fenêtre allume le direct sans qu'on ait à recharger la page. */
function syncLive() {
  const want = liveWanted();
  if (want && liveTimer === null) {
    note(t("connexion au direct…"));
    pollLive();
    liveTimer = setInterval(pollLive, LIVE_EVERY_MS);
  } else if (!want && liveTimer !== null) {
    clearInterval(liveTimer);
    liveTimer = null;
    liveSnapshot = null;
  }
  renderLiveButton();
}

function renderLiveButton() {
  const btn = document.getElementById("live");
  if (!btn) return;
  const possible = location.protocol !== "file:" && liveFixtures().length > 0;
  btn.hidden = !possible;
  if (!possible) return;
  const on = liveTimer !== null;
  btn.textContent = (on ? "● " : "○ ") + t("Direct");
  btn.setAttribute("aria-pressed", String(on));
  btn.title = on ? t("Arrêter le suivi en direct")
                 : t("Suivre les matchs en cours, relevé toutes les minutes");
}

async function pollLive() {
  let snap;
  try {
    const res = await fetch("api/live?t=" + Date.now(), { cache: "no-store" });
    // Comme pour « Rafraîchir » : ce n'est pas le code HTTP qui prouve la
    // présence de serve.py, c'est qu'il réponde du JSON.
    if (!(res.headers.get("content-type") || "").includes("application/json")) {
      throw new Error("pas de serveur de collecte");
    }
    snap = await res.json();
  } catch (e) {
    // Page publiée ou serveur arrêté : on coupe, en le disant une fois.
    setLive(false, t("le direct demande « python serve.py » : cette page ne peut " +
                     "pas interroger Forebet elle-même (pas de CORS)."));
    return;
  }
  liveSnapshot = snap;
  // Repeindre seulement quand quelque chose a bougé, mais dater le relevé à
  // tous les coups : c'est cette heure qui dit que le direct avance encore.
  if (applyLive(snap)) renderAll();
  renderLiveNote();
}

/* Recopie les relevés reçus dans la charge utile en place. Renvoie vrai si
   quelque chose a bougé — inutile de repeindre la page toutes les quinze
   secondes pour rien. */
function applyLive(snap) {
  const live = snap.live || {};
  let changed = false;

  (DATA.matches || []).forEach(m => {
    const block = live[String(m.match_id)];
    if (!block) return;
    if (JSON.stringify(m.match_stats) !== JSON.stringify(block)) changed = true;
    m.match_stats = block;
    m.live = !block.full_time;
  });

  /* Le score de la liste des rencontres suit les buts relevés : c'est la
     première chose qu'on regarde. `played` n'est PAS touché — un match en cours
     n'est pas un match joué, et les filtres doivent continuer de le classer
     parmi les rencontres à venir. */
  (DATA.fixtures || []).forEach(f => {
    const block = live[String(f.match_id)];
    if (!block) return;
    const h = (block.home || {}).goals, a = (block.away || {}).goals;
    const wasLive = f.live;
    f.live = !block.full_time;
    f.unstable = !!block.unstable;
    if (h === null || h === undefined || a === null || a === undefined) return;
    const score = h + " - " + a;
    if (f.score !== score || wasLive !== f.live) { f.score = score; changed = true; }
  });

  return changed;
}

/* L'heure du relevé, sous la barre : sans elle, on ne saurait pas si le direct
   avance ou s'il est resté bloqué sur un vieux chiffre. */
function renderLiveNote() {
  if (liveTimer === null || !liveSnapshot) return;
  const snap = liveSnapshot;
  if (snap.state && snap.state !== "ok") {
    note(snap.state === "démarrage"
      ? t("aucun relevé pour l'instant — le premier arrive dans moins d'une minute.")
      : snap.state);
    return;
  }
  const when = (snap.collected || "").split("T")[1] || "";
  const n = Object.keys(snap.live || {}).length;
  note(ph("liveWatching", n) + " · " + ph("liveAt", when) + ".", "ok");
}

/* ---------- rafraîchissement ---------- */
/* Deux situations, et le bouton n'a aucun moyen de les deviner à l'avance :

   - servie par `serve.py`, la page peut demander une VRAIE collecte : c'est
     Python qui pilote Chrome, franchit le challenge Cloudflare et réécrit la
     page ;
   - publiée (GitHub Pages) ou ouverte en file://, elle ne peut pas : Forebet
     n'envoie aucun en-tête CORS, un fetch direct meurt en « Failed to fetch ».
     Elle se rabat alors sur le `data.json` déposé à côté d'elle, qui apporte ce
     qui a été publié depuis la génération de la page.

   D'où : on tente le serveur, on retombe sur le fichier, et on dit lequel des
   deux a répondu — un bouton qui semble marcher sans rien rapporter serait pire
   que pas de bouton. */
const note = (text, cls) => {
  const n = document.getElementById("refnote");
  n.className = "refnote" + (cls ? " " + cls : "");
  n.textContent = text;
};

function applyData(payload) {
  // `data.json` n'embarque pas les écussons — 387 Ko d'images inchangées qu'on
  // ne va pas retélécharger à chaque clic. On garde donc ceux de la page quand
  // la charge utile reçue n'en apporte pas. La réponse de `serve.py`, elle, est
  // complète.
  DATA = payload.teams ? payload : { ...payload, teams: DATA.teams };
  fillTeamSelect();
  renderFoot();
  renderAll();
}

async function askServer() {
  // file:// n'a pas d'origine à qui parler : inutile d'essayer.
  if (location.protocol === "file:") return null;
  let res;
  try {
    res = await fetch("api/refresh", { method: "POST" });
  } catch (e) {
    return null;                     // personne au bout du fil
  }
  // On ne se fie PAS au code HTTP pour savoir si serve.py est là : un
  // `http.server` nu répond 501, GitHub Pages 405, un autre hébergeur autre
  // chose encore. Ce qui identifie serve.py, c'est qu'il répond du JSON — lui
  // en renvoie sur toutes ses réponses, succès comme erreur.
  if (!(res.headers.get("content-type") || "").includes("application/json")) {
    return null;
  }
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.error) || `HTTP ${res.status}`);
  return body;
}

/* Le fichier de données porte le nom de la page : `index.html` ->
   `index.data.json`. Sinon un build local sur `console.html` écraserait la
   donnée publiée à côté de `index.html`. Une URL en « / » sert index.html. */
function dataUrl() {
  const file = location.pathname.split("/").pop() || "index.html";
  return file.replace(/\.html?$/i, "") + ".data.json";
}

async function askDataFile() {
  // Cache-busting : sans ça le navigateur resservirait le fichier qu'il a déjà,
  // et le bouton ne rapporterait jamais rien de neuf.
  const url = dataUrl();
  const res = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error(`${url} : HTTP ${res.status}`);
  return res.json();
}

async function refresh(btn) {
  btn.disabled = true;
  btn.setAttribute("aria-busy", "true");
  note(t("collecte en cours — une minute environ…"));
  try {
    let fresh = null;
    try {
      fresh = await askServer();
    } catch (e) {
      // Le serveur a répondu et a échoué : c'est une vraie panne de collecte,
      // pas l'absence de serveur. On s'arrête là plutôt que de resservir un
      // data.json qui masquerait l'erreur.
      note(ph("refreshFailed", e.message), "err");
      return;
    }
    if (fresh) {
      applyData(fresh);
      note(ph("refreshDone", fresh.generated), "ok");
      return;
    }

    // Pas de serveur de collecte : reste le data.json déposé à côté.
    note(t("recherche d'une version plus récente…"));
    let data;
    try {
      data = await askDataFile();
    } catch (e) {
      note(t("rien à rafraîchir ici : cette page est un instantané, et Forebet " +
             "n'autorise pas le navigateur à l'interroger (pas de CORS). " +
             "Lance « python serve.py » en local pour un vrai rafraîchissement."));
      return;
    }
    if (data.now_iso && DATA.now_iso && data.now_iso <= DATA.now_iso) {
      note(ph("refreshCurrent", DATA.generated));
      return;
    }
    applyData(data);
    note(ph("refreshUpdated", data.generated), "ok");
  } finally {
    btn.disabled = false;
    btn.removeAttribute("aria-busy");
  }
}

function boot() {
  renderChrome();
  fillTeamSelect();
  document.getElementById("team")
    .addEventListener("change", e => { state.team = e.target.value; renderAll(); });

  const scope = document.getElementById("scope");
  scope.value = state.scope;
  scope.addEventListener("change", e => { state.scope = e.target.value; renderAll(); });

  document.getElementById("lang").addEventListener("click", () => {
    setLang(lang === "fr" ? "en" : "fr");
  });

  document.getElementById("promptlang").addEventListener("click", () => {
    promptLang = promptLang === "fr" ? "en" : "fr";
    try { localStorage.setItem("console-prompt-lang", promptLang); } catch (e) { /* mode privé */ }
    renderChrome();
    // Le brief déjà affiché doit suivre : le laisser dans l'ancienne langue
    // ferait croire que le bouton n'a rien fait.
    renderDetail();
  });

  document.getElementById("theme").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  });

  const btn = document.getElementById("refresh");
  btn.addEventListener("click", () => refresh(btn));

  document.getElementById("live").addEventListener("click", () => {
    const on = liveTimer === null;
    // À l'arrêt, on le dit : sinon la ligne d'état garderait l'heure du dernier
    // relevé, et on croirait le direct figé plutôt qu'éteint.
    setLive(on, on ? null : t("suivi en direct arrêté — les chiffres affichés " +
                              "restent ceux du dernier relevé."));
  });

  renderFoot();
  renderAll();   // allume le direct au passage, si une rencontre se joue
}
boot();
</script>

</html>
