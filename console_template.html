<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console Forebet — Division 1 Koweït</title>
<style>
/* ---------------------------------------------------------------------------
   Palette validée avec scripts/validate_palette.js (skill dataviz) :
   entités #2a78d6 / #eb6834 (clair), #3987e5 / #d95926 (sombre) — tous les
   contrôles PASS, séparation CVD ΔE 24.7 clair / 26.8 sombre.

   Le domicile est TOUJOURS bleu et l'extérieur TOUJOURS orange, partout : la
   couleur suit l'équipe, jamais son rang ni son résultat. Le gris `--muted-bar`
   n'est jamais une équipe : il porte les buts encaissés, que la position sous
   la ligne de base distingue déjà.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --plane: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --home: #2a78d6;
  --away: #eb6834;
  --muted-bar: #898781;
  --good: #0ca30c;
  --critical: #d03b3b;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.05);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19; --plane: #0d0d0d;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
    --home: #3987e5; --away: #d95926; --muted-bar: #898781;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --plane: #0d0d0d;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
  --home: #3987e5; --away: #d95926; --muted-bar: #898781;
  --shadow: none;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--plane); color: var(--text-primary);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 72px; }

.topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.brand { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.controls { display: flex; gap: 8px; align-items: center; }
select, .btn {
  font: inherit; font-size: 13px; color: var(--text-primary);
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; cursor: pointer;
}
.btn:hover, select:hover { border-color: var(--axis); }

.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.card > h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.card > .sub { margin: 0 0 18px; font-size: 13px; color: var(--text-secondary); max-width: 68ch; }

/* --- bandeau --- */
.matchhead { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: baseline; }
.vs { font-size: 22px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.vs .sep { color: var(--text-muted); font-weight: 400; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.dot.home { background: var(--home); }
.dot.away { background: var(--away); }
.kickoff { font-size: 13px; color: var(--text-secondary); width: 100%; }

/* --- carte d'identité : deux colonnes de tuiles --- */
.idgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 700px) { .idgrid { grid-template-columns: 1fr; } }
.idcol { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.idname { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 2px; }
.idrank { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; }
.tile .tl { font-size: 11px; color: var(--text-muted); letter-spacing: .03em; }
/* Chiffres proportionnels : tabular-nums fait « respirer » un grand nombre. */
.tile .tv { font-size: 21px; font-weight: 600; line-height: 1.2; }
.tile .tn { font-size: 11px; color: var(--text-muted); }

/* --- comparatif tête à tête --- */
.h2h { display: grid; grid-template-columns: 62px 1fr 178px 1fr 62px; align-items: center; gap: 6px 10px; }
.h2h .lbl { text-align: center; font-size: 13px; color: var(--text-secondary); }
.h2h .vh, .h2h .va { font-size: 13px; font-variant-numeric: tabular-nums; }
.h2h .vh { text-align: right; }
.h2h .grp {
  grid-column: 1 / -1; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-muted); margin: 14px 0 2px; border-top: 1px solid var(--grid); padding-top: 12px;
}
.h2h .grp:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
.barL, .barR { height: 14px; display: flex; }
.barL { justify-content: flex-end; }
.barL i { background: var(--home); border-radius: 4px 0 0 4px; height: 100%; display: block; }
.barR i { background: var(--away); border-radius: 0 4px 4px 0; height: 100%; display: block; }

/* --- statistiques relevées du match --- */
/* Une seule barre coupée en deux, parce que la possession est un partage :
   deux barres indépendantes laisseraient croire à deux mesures séparées. */
.poss { display: flex; height: 26px; border-radius: 6px; overflow: hidden; margin: 4px 0 6px; }
.poss i { display: block; height: 100%; }
.poss .ph { background: var(--home); }
.poss .pa { background: var(--away); }
.possv { display: flex; justify-content: space-between; font-size: 13px; font-variant-numeric: tabular-nums; }

.grp2 {
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-muted); border-top: 1px solid var(--grid); padding-top: 12px;
}
.tline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ev {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  border: 1px solid var(--grid); border-radius: 999px; padding: 3px 10px 3px 4px;
}
.ev b { font-variant-numeric: tabular-nums; font-weight: 600; }
.ev .side { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.ev .side.home { background: var(--home); }
.ev .side.away { background: var(--away); }
/* Le nom du buteur : c'est l'information neuve de cette chronologie, elle doit
   se lire avant le libellé qui la précède. */
.ev b.who { font-weight: 600; color: var(--text-primary); }
/* Un carton compte moins qu'un but : il s'efface d'un cran plutôt que de
   ponctuer la ligne au même niveau. */
.ev.card-ev { opacity: .72; }

/* --- effectifs --- */
.squad { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
@media (max-width: 720px) { .squad { grid-template-columns: 1fr; } }
.sqhead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.sqmeta { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
.sqgrp {
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-muted); margin: 14px 0 5px; border-top: 1px solid var(--grid);
  padding-top: 9px;
}
.sqgrp:first-of-type { border-top: 0; margin-top: 6px; padding-top: 0; }
.pl { display: flex; align-items: baseline; gap: 8px; font-size: 13px; padding: 3px 0; }
/* Largeur fixe pour le numéro : sans ça les noms ne s'alignent pas, et une
   liste d'effectif se lit d'abord en colonne. */
.pl .no {
  min-width: 22px; text-align: right; font-variant-numeric: tabular-nums;
  color: var(--text-muted); font-size: 12px;
}
.pl .nom { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .nat { font-size: 11px; color: var(--text-muted); }
.pl .bu {
  font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 999px;
  background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good);
}

/* --- graphique buts marqués / encaissés --- */
/* Les colonnes sont plafonnées à 26 px : le bloc prend donc la largeur de ses
   données, et la ligne de base comme l'axe s'alignent dessus plutôt que de
   traverser une zone vide qui se lirait comme des matchs manquants. */
.gwrap { margin-top: 6px; width: fit-content; max-width: 100%; min-width: min(100%, 380px); }
.gchart { display: flex; align-items: stretch; gap: 3px; height: 96px; }
.gcol { flex: 1 1 0; max-width: 24px; min-width: 6px; display: flex; flex-direction: column; cursor: default; }
.gcol .up { flex: 1; display: flex; align-items: flex-end; }
.gcol .dn { flex: 1; display: flex; align-items: flex-start; }
.gcol i { width: 100%; display: block; min-height: 2px; }
.gcol .up i { border-radius: 4px 4px 0 0; }
.gcol .dn i { border-radius: 0 0 4px 4px; background: var(--muted-bar); }
.baseline { height: 1px; background: var(--axis); margin: 0; }
.gaxis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 6px; }

/* --- pastilles de forme : lettre + couleur, jamais la couleur seule --- */
.form { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.form span { width: 19px; height: 19px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #fff; display: grid; place-items: center; }
.form .V { background: var(--good); }
.form .N { background: var(--text-muted); }
.form .D { background: var(--critical); }

.keys { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--text-secondary); }
.key { display: flex; align-items: center; gap: 7px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 9px; text-align: right; border-bottom: 1px solid var(--grid); }
th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
td { font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
tr.mark-home td { background: color-mix(in srgb, var(--home) 9%, transparent); }
tr.mark-away td { background: color-mix(in srgb, var(--away) 9%, transparent); }

details { margin-top: 12px; }
summary { cursor: pointer; font-size: 13px; color: var(--text-secondary); padding: 6px 0; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸ "; color: var(--text-muted); }
details[open] summary::before { content: "▾ "; }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 700px) { .split { grid-template-columns: 1fr; } }
.teamhead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.teamhead .tt { font-weight: 600; }
.teamhead .tr2 { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

/* --- liste des rencontres --- */
.daylabel {
  font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-muted); margin: 18px 0 6px;
}
.daylabel:first-of-type { margin-top: 0; }
.fx {
  display: grid; grid-template-columns: 92px 1fr auto; align-items: center;
  gap: 12px; width: 100%; text-align: left;
  padding: 11px 12px; border: 1px solid transparent; border-radius: 9px;
  background: none; color: inherit; font: inherit;
}
button.fx { cursor: pointer; }
button.fx:hover { background: color-mix(in srgb, var(--text-primary) 4%, transparent); }
.fx[aria-current="true"] { border-color: var(--axis); background: color-mix(in srgb, var(--text-primary) 5%, transparent); }
.fx .when { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.fx .who { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 15px; }
.fx .who .sep { color: var(--text-muted); }
.fx .go { font-size: 12px; color: var(--text-muted); }
.fx .sc { font-weight: 600; font-variant-numeric: tabular-nums; }
.fx .sc.live { color: var(--critical); }
.badge {
  font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
  border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
  color: var(--text-secondary);
}
/* Le direct se signale par une pastille qui bat. Le battement s'arrête si la
   personne a demandé moins d'animations — c'est un ornement, pas une info. */
/* Le numéro de journée est un repère, pas une alerte : il reste discret pour
   ne pas concurrencer « aujourd'hui » ou « en direct » sur la même ligne. */
.badge.round { color: var(--text-muted); letter-spacing: 0; }
.badge.live { color: var(--critical); border-color: var(--critical); }
.badge.live::before {
  content: ""; display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; background: var(--critical);
  margin-right: 6px; vertical-align: middle;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) {
  .badge.live::before { animation: none; }
}
.empty { font-size: 13px; color: var(--text-secondary); padding: 8px 0; }

/* --- écussons --- */
.crest { width: 26px; height: 26px; object-fit: contain; flex: none; }
.crest.sm { width: 20px; height: 20px; }
.crest.lg { width: 42px; height: 42px; }
/* Beaucoup d'écussons sont sur fond transparent avec des traits sombres :
   sur le thème sombre ils disparaîtraient sans ce halo. */
:root[data-theme="dark"] .crest,
:root:where(:not([data-theme="light"])) .crest {
  background: rgba(255, 255, 255, 0.92); border-radius: 5px; padding: 1px;
}
@media (prefers-color-scheme: light) {
  :root:where(:not([data-theme="dark"])) .crest { background: none; padding: 0; }
}
.clubchip { width: 10px; height: 10px; border-radius: 3px; flex: none; border: 1px solid var(--border); }

/* --- générateur de prompt --- */
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
.btn.primary { border-color: var(--axis); font-weight: 600; }
.promptbox {
  margin-top: 14px; border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; background: var(--plane);
}
.promptbox textarea {
  width: 100%; min-height: 320px; resize: vertical;
  font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
  color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 8px; padding: 12px;
}
.copied { font-size: 13px; color: var(--good); }

/* --- deux colonnes : stats à gauche, classement collant à droite --- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 296px; gap: 16px; align-items: start; }
@media (max-width: 940px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.side { position: sticky; top: 16px; }
/* Le classement ne doit jamais dépasser l'écran : au-delà il défile seul. */
.side .card { max-height: calc(100vh - 32px); overflow-y: auto; }
.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
.mini td { padding: 5px 4px; border-bottom: 1px solid var(--grid); text-align: right; }
.mini tr:last-child td { border-bottom: 0; }
.mini .r { width: 20px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.mini .t { text-align: left; width: 100%; }
.mini .t span { display: inline-flex; align-items: center; gap: 6px; }
.mini .p { font-weight: 600; font-variant-numeric: tabular-nums; }
.mini .d { color: var(--text-secondary); font-variant-numeric: tabular-nums; width: 34px; }
.mini .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 132px; display: inline-block; vertical-align: middle; }
.mini tr.mark-home td { background: color-mix(in srgb, var(--home) 11%, transparent); }
.mini tr.mark-away td { background: color-mix(in srgb, var(--away) 11%, transparent); }
.mini thead td { color: var(--text-muted); font-size: 11px; border-bottom: 1px solid var(--axis); }

.scroll { overflow-x: auto; }
.foot { margin-top: 26px; font-size: 12px; color: var(--text-muted); }

/* Le bouton « Rafraîchir » parle sous la barre : la collecte prend une minute,
   il faut de la place pour dire ce qui se passe, pas seulement un spinner. */
.refnote { font-size: 12px; color: var(--text-muted); margin: -6px 0 14px; min-height: 1em; }
.refnote.err { color: var(--critical); }
.refnote.ok { color: var(--good); }
.btn[aria-busy="true"] { opacity: .6; cursor: progress; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">Console Forebet · Division 1 Koweït</div>
    <div class="controls">
      <select id="team"></select>
      <select id="scope">
        <option value="upcoming"></option>
        <option value="today"></option>
        <option value="played"></option>
        <option value="all"></option>
      </select>
      <!-- N'apparaît que pendant qu'une rencontre se joue : un bouton « Direct »
           visible un mardi matin ne pourrait rien suivre. -->
      <button class="btn" id="live" type="button" hidden></button>
      <button class="btn" id="refresh" type="button"></button>
      <!-- Langue de l'interface, et langue du brief Instagram : deux réglages
           distincts. Le carrousel est du contenu éditorial — sa langue ne doit
           pas suivre le navigateur d'un visiteur de passage. -->
      <button class="btn" id="lang" type="button"></button>
      <button class="btn" id="promptlang" type="button"></button>
      <button class="btn" id="theme" type="button"></button>
    </div>
  </div>
  <div class="refnote" id="refnote"></div>
  <div id="fixtures"></div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
/* `let` et non `const` : le bouton « Rafraîchir » remplace la charge utile en
   place. Elle reste embarquée dans la page pour que celle-ci s'ouvre seule, en
   file:// et hors ligne — c'est la raison d'être de ce fichier unique. */
let DATA = /*__CONSOLE_DATA__*/null;

/* ---------- langue ---------- */
/* Le dictionnaire est indexé par la chaîne française elle-même, pas par une
   clé abstraite. Deux raisons : le code reste lisible tel quel (`t("Comparatif")`
   se comprend sans aller voir la table), et une entrée oubliée retombe sur le
   français plutôt que d'afficher une clé nue à l'écran.

   Les phrases à trous vivent dans `PH`, en deux versions : une traduction ne se
   fabrique pas en recollant des morceaux traduits séparément. */
const EN = {
  // barre d'outils
  "Toutes les équipes": "All teams",
  "À venir": "Upcoming", "Aujourd'hui": "Today", "Joués": "Played", "Toutes": "All",
  "Rafraîchir": "Refresh", "Thème": "Theme",
  "Direct": "Live", "en direct": "live",
  "But": "Goal", "But sur penalty": "Penalty", "But contre son camp": "Own goal",
  "Carton jaune": "Yellow card", "Carton rouge": "Red card",
  "Second jaune": "Second yellow",
  "La source ne nomme pas tous les buteurs ; les buts sans nom sont conservés, le compte reste juste.":
    "The source does not name every scorer; unnamed goals are kept, so the count stays right.",
  "Sur le banc": "In the dugout",
  "Matchs sans encaisser": "Clean sheets",
  "Buts sur penalty": "Penalty goals",
  "Bilan de saison · Sofascore": "Season record · Sofascore",
  "Suivre les matchs en cours, relevé toutes les minutes":
    "Follow matches in progress, updated every minute",
  "Arrêter le suivi en direct": "Stop following live",
  "connexion au direct…": "connecting to the live feed…",
  "suivi en direct arrêté — les chiffres affichés restent ceux du dernier relevé.":
    "live tracking stopped — the figures on screen are those of the last reading.",
  "aucun relevé pour l'instant — le premier arrive dans moins d'une minute.":
    "nothing recorded yet — the first reading lands within a minute.",
  "le direct demande « python serve.py » : cette page ne peut pas interroger Forebet elle-même (pas de CORS).":
    "live needs “python serve.py”: this page cannot query Forebet itself (no CORS).",
  "Score en direct, à confirmer : la source a déjà réattribué un but d'un camp à l'autre sur cette rencontre.":
    "Live score, unconfirmed: the source has already moved a goal from one side to the other in this match.",
  "Relevé en direct, encore incomplet : la source remplit les rubriques au fil du match, et ne publie ni la minute ni les faits de jeu avant la fin.":
    "Live reading, still partial: the source fills the categories as the match goes on, and publishes neither the clock nor the events before full time.",
  "Filtrer par équipe": "Filter by team", "Filtrer par période": "Filter by period",
  "Console Forebet · Division 1 Koweït": "Forebet console · Kuwait Division 1",
  "Console Forebet": "Forebet console",
  // titres de cartes
  "Rencontres": "Fixtures", "Carte d'identité": "Profile", "Comparatif": "Comparison",
  "Statistiques du match": "Match statistics", "Parcours": "Season run",
  "Contexte de la rencontre": "Match context", "Classement": "Table",
  "Contenu Instagram": "Instagram content", "Face à face": "Head to head",
  "Effectifs": "Squads", "effectif non récupéré": "squad not fetched",
  "Effectifs de la saison, pas les compositions du jour : aucune source ne publie de feuille de match pour ce championnat. Les buts sont la seule statistique individuelle disponible. Source : Sofascore.":
    "Season squads, not today's line-ups: no source publishes a team sheet for this league. Goals are the only individual statistic available. Source: Sofascore.",
  // en-tête de rencontre
  "reçoit": "hosts", "date inconnue": "date unknown",
  "Diffusion : ": "Broadcast: ",
  "position au classement indisponible": "league position unavailable",
  // carte d'identité
  "Victoires": "Wins", "Nuls": "Draws", "Défaites": "Losses",
  "Buts pour": "Goals for", "Buts contre": "Goals against", "Différence": "Difference",
  "Tirs": "Shots", "Att. dangereuses": "Dangerous attacks", "Clean sheets": "Clean sheets",

/* Les faits de jeu arrivent étiquetés en français par `fetch_stats.py` ; on
   retraduit depuis leur `type`, qui lui est neutre. */
const EVENT_EN = {
  goal: "goal", owngoal: "own goal", penalty: "penalty",
  missed_penalty: "missed penalty", yellowcard: "yellow card",
  redcard: "red card", yellowredcard: "second yellow",
  substitution: "substitution", var: "VAR",
};

const ordinalEn = n => {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
};

function detectLang() {
  const saved = (() => { try { return localStorage.getItem("console-lang"); } catch (e) { return null; } })();
  if (saved === "fr" || saved === "en") return saved;
  // « Connexion non FR » : on lit les langues du navigateur. L'anglais est le
  // repli pour tout ce qui n'est pas francophone.
  //
  // On respecte l'ORDRE de préférence : la première langue déclarée décide. Un
  // visiteur en `en-GB, fr` lit le français, mais préfère l'anglais — lui servir
  // du français parce que « fr » figure quelque part dans sa liste serait ignorer
  // ce qu'il a demandé.
  const prefs = navigator.languages && navigator.languages.length
    ? navigator.languages : [navigator.language || "fr"];
  const first = String(prefs[0] || "").toLowerCase();
  return first.startsWith("fr") ? "fr" : "en";
}

let lang = detectLang();
let promptLang = (() => {
  try { return localStorage.getItem("console-prompt-lang") || "fr"; } catch (e) { return "fr"; }
})();

const t = s => lang === "en" ? (EN[s] ?? s) : s;
const ph = (key, ...args) => PH[key][lang](...args);
// Le brief a sa propre langue : il produit du contenu éditorial, pas de l'interface.
const phP = (key, ...args) => PH[key][promptLang](...args);
// Lettres de forme : V/N/D en français, W/D/L en anglais. La classe CSS reste
// la lettre d'origine, sinon les couleurs sauteraient.
const formLetter = ch => lang === "en" ? ({ V: "W", N: "D", D: "L" }[ch] || ch) : ch;

/* ---------- utilitaires ---------- */
const el = (t, cls, txt) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (txt !== undefined && txt !== null) n.textContent = txt;
  return n;
};
// Les totaux de la section « autres » sont parfois du texte (« 0 / 0 » pour les
// penaltys) : on ne trace une barre que si les deux côtés sont numériques.
const num = v => {
  if (typeof v === "number") return v;
  if (typeof v !== "string") return null;
  return /^-?\d+(?:[.,]\d+)?$/.test(v) ? parseFloat(v.replace(",", ".")) : null;
};
const r2 = d => (d === null || d === undefined) ? "—" : Math.round(d * 100) / 100;
const rowOf = (m, name) => (m.standings || []).find(r => r.team === name) || null;

/* Écusson du club, embarqué en data: URI — la page reste un fichier unique. */
function crestOf(name, size) {
  const entry = (DATA.teams || {})[name];
  if (!entry || !entry.badge) return null;
  const img = el("img", "crest" + (size ? " " + size : ""));
  img.src = entry.badge;
  img.alt = "";           // décoratif : le nom du club est déjà écrit à côté
  img.loading = "lazy";
  return img;
}

/* Pastille de la couleur réelle du club, à côté de son nom. */
function clubChip(name) {
  const colors = ((DATA.teams || {})[name] || {}).colors || [];
  if (!colors.length) return null;
  const chip = el("span", "clubchip");
  chip.style.background = colors[0];
  chip.title = `${name} — ${colors[0]}`;
  return chip;
}

function teamLabel(name, size) {
  const box = el("span");
  box.style.display = "inline-flex";
  box.style.alignItems = "center";
  box.style.gap = "8px";
  const crest = crestOf(name, size);
  if (crest) box.appendChild(crest);
  box.appendChild(el("span", null, name));
  return box;
}
// Blocs : 0 face à face, 1 et 2 le parcours complet de chaque équipe,
// 3 le domicile de l'équipe qui reçoit, 4 l'extérieur de l'équipe qui se déplace.
const block = (m, i) => (m.result_blocks || [])[i] || null;

/* ---------- bandeau ---------- */
function renderHead(m) {
  const card = el("div", "card");
  const box = el("div", "matchhead");
  const vs = el("div", "vs");
  vs.appendChild(el("span", "dot home"));
  vs.appendChild(teamLabel(m.home, "lg"));
  vs.appendChild(el("span", "sep", t("reçoit")));
  vs.appendChild(el("span", "dot away"));
  vs.appendChild(teamLabel(m.away, "lg"));
  box.appendChild(vs);
  box.appendChild(el("div", "kickoff", ph("kickoffLine", m)));
  const tv = broadcastLine(m);
  if (tv) box.appendChild(tv);
  card.appendChild(box);
  return card;
}

/* Diffuseur : confirmé (saisi) ou simple rappel des chaînes habituelles. */
function broadcastLine(m) {
  const b = m.broadcast;
  if (!b) return null;
  const line = el("div", "kickoff");
  if (b.confirmed) {
    line.appendChild(el("strong", null, t("Diffusion : ")));
    line.appendChild(document.createTextNode(b.channel));
  } else if (b.usual && b.usual.length) {
    line.style.color = "var(--text-muted)";
    line.textContent = ph("broadcastUsual", b.usual.join(", "));
  } else {
    return null;
  }
  return line;
}

/* ---------- carte d'identité ---------- */
function tile(label, value, note) {
  // Nommée `box` et non `t` : `t` est la fonction de traduction.
  const box = el("div", "tile");
  box.appendChild(el("div", "tl", label));
  box.appendChild(el("div", "tv", value));
  if (note) box.appendChild(el("div", "tn", note));
  return box;
}

function renderIdentity(m) {
  const card = el("div", "card");
  card.appendChild(el("h2", null, t("Carte d'identité")));
  card.appendChild(el("p", "sub", t(
    "Chiffres de la saison en cours, tirés du classement et des relevés de la " +
    "source. Les moyennes sont par match joué.")));

  const grid = el("div", "idgrid");
  [["home", m.home], ["away", m.away]].forEach(([side, name]) => {
    const col = el("div", "idcol");
    const head = el("div", "idname");
    head.appendChild(el("span", "dot " + side));
    head.appendChild(teamLabel(name));
    const chip = clubChip(name);
    if (chip) head.appendChild(chip);
    col.appendChild(head);

    const st = rowOf(m, name);
    const stats = (m.stats || {})[side] || {};
    col.appendChild(el("div", "idrank", st
      ? ph("rankLine", st)
      : t("position au classement indisponible")));

    const tiles = el("div", "tiles");
    const avg = v => v != null ? ph("perMatch", r2(v)) : "";
    if (st) {
      tiles.appendChild(tile(t("Victoires"), st.wins, ph("outOf", st.played)));
      tiles.appendChild(tile(t("Nuls"), st.draws, ""));
      tiles.appendChild(tile(t("Défaites"), st.losses, ""));
    }
    tiles.appendChild(tile(t("Buts pour"), stats.goals?.scored ?? "—",
      avg(stats.goals?.scored_avg)));
    tiles.appendChild(tile(t("Buts contre"), stats.goals?.conceded ?? "—",
      avg(stats.goals?.conceded_avg)));
    tiles.appendChild(tile(t("Différence"),
      st ? (st.goal_diff > 0 ? "+" + st.goal_diff : st.goal_diff) : "—", ""));
    tiles.appendChild(tile(t("Tirs"), stats.shots?.total ?? "—",
      avg(stats.shots?.total_avg)));
    tiles.appendChild(tile(t("Att. dangereuses"), stats.attacks?.dangerous ?? "—",
      avg(stats.attacks?.dangerous_avg)));
    const cs = (m.stats?.others || {})["Aucun but encaissé"];
    tiles.appendChild(tile(t("Clean sheets"), cs ? (cs[side]?.total ?? "—") : "—", ""));
    col.appendChild(tiles);

    // Les deux moitiés de cette carte ne couvrent pas le même périmètre : le
    // classement ne compte que le championnat, tandis que les relevés de
    // Forebet agrègent toutes les compétitions. Quand les deux divergent, on le
    // dit — sinon « 9V sur 16 » à côté de « 20 buts contre » (sur 17 matchs)
    // passe pour une contradiction.
    const runs = block(m, side === "home" ? 1 : 2);
    if (st && runs) {
      const extra = runs.matches.filter(r => r.competition && r.competition !== m.competition_tag);
      if (extra.length) {
        const names = [...new Set(extra.map(r => r.competition))].join(", ");
        const note = el("div", "idrank",
          ph("scopeNote", st.played, runs.record.played, extra.length, names));
        note.style.margin = "14px 0 0";
        col.appendChild(note);
      }
    }
    grid.appendChild(col);
  });
  card.appendChild(grid);
  return card;
}

/* ---------- comparatif tête à tête ---------- */
function h2hRow(grid, label, hv, av) {
  const h = num(hv), a = num(av);
  const max = Math.max(Math.abs(h ?? 0), Math.abs(a ?? 0)) || 1;

  grid.appendChild(el("div", "vh", h === null ? String(hv ?? "—") : String(r2(h))));
  const left = el("div", "barL");
  if (h !== null) {
    const i = el("i");
    i.style.width = (Math.abs(h) / max * 100) + "%";
    i.title = `${label} — ${grid.dataset.home} : ${r2(h)}`;
    left.appendChild(i);
  }
  grid.appendChild(left);
  grid.appendChild(el("div", "lbl", label));
  const right = el("div", "barR");
  if (a !== null) {
    const i = el("i");
    i.style.width = (Math.abs(a) / max * 100) + "%";
    i.title = `${label} — ${grid.dataset.away} : ${r2(a)}`;
    right.appendChild(i);
  }
  grid.appendChild(right);
  grid.appendChild(el("div", "va", a === null ? String(av ?? "—") : String(r2(a))));
}

function renderCompare(m) {
  const card = el("div", "card");
  card.appendChild(el("h2", null, t("Comparatif")));
  card.appendChild(el("p", "sub", t(
    "Chaque ligne est mise à l'échelle indépendamment : la longueur compare les " +
    "deux équipes entre elles, pas une ligne à l'autre. Les valeurs sont écrites " +
    "de part et d'autre, donc rien ne dépend de la couleur ni du survol.")));

  const legend = el("div", "keys");
  legend.style.marginBottom = "18px";
  [["home", m.home], ["away", m.away]].forEach(([side, name]) => {
    const k = el("div", "key");
    const sw = el("span", "swatch");
    sw.style.background = `var(--${side})`;
    k.appendChild(sw);
    k.appendChild(teamLabel(name, "sm"));
    legend.appendChild(k);
  });
  card.appendChild(legend);

  const grid = el("div", "h2h");
  grid.dataset.home = m.home;
  grid.dataset.away = m.away;
  const H = m.stats?.home || {}, A = m.stats?.away || {};
  const others = m.stats?.others || {};
  // `group` prenait `t` en paramètre : renommé, sinon il masquerait la fonction
  // de traduction du même nom à l'intérieur de son corps.
  const group = label => grid.appendChild(el("div", "grp", t(label)));
  // Les clés de `others` viennent des pages françaises de Forebet : c'est de la
  // donnée, pas de l'interface. On traduit à l'affichage, jamais la clé.
  const pick = (label, key) => [t(label), others[key]?.home?.total, others[key]?.away?.total];

  group("Attaque");
  h2hRow(grid, t("Buts marqués"), H.goals?.scored, A.goals?.scored);
  h2hRow(grid, t("Buts marqués / match"), H.goals?.scored_avg, A.goals?.scored_avg);
  h2hRow(grid, t("Tirs"), H.shots?.total, A.shots?.total);
  h2hRow(grid, t("Tirs / match"), H.shots?.total_avg, A.shots?.total_avg);
  h2hRow(grid, t("Attaques"), H.attacks?.total, A.attacks?.total);
  h2hRow(grid, t("Attaques dangereuses"), H.attacks?.dangerous, A.attacks?.dangerous);

  group("Défense");
  h2hRow(grid, t("Buts encaissés"), H.goals?.conceded, A.goals?.conceded);
  h2hRow(grid, t("Buts encaissés / match"), H.goals?.conceded_avg, A.goals?.conceded_avg);
  if (others["Aucun but encaissé"]) h2hRow(grid, ...pick("Clean sheets", "Aucun but encaissé"));

  const jeu = ["Corners", "Hors-jeu"].filter(k => others[k]);
  if (jeu.length) {
    group("Jeu");
    jeu.forEach(k => h2hRow(grid, ...pick(k, k)));
  }

  const disc = ["Fautes", "Cartons jaunes", "Cartons rouges"].filter(k => others[k]);
  if (disc.length) {
    group("Discipline");
    disc.forEach(k => h2hRow(grid, ...pick(k, k)));
  }
  // Le bilan que Sofascore agrège de son côté. Il est mis à part, et pas fondu
  // dans les lignes du dessus, parce que les deux sources ne comptent pas le
  // même nombre de matchs : les mélanger ferait croire à une contradiction là
  // où il n'y a qu'un décalage de fraîcheur. Ce qu'il apporte vraiment, ce sont
  // les **buts sur penalty** — Forebet affiche « 0 / 0 » pour tout le monde.
  const HS = m.squads?.home?.season, AS = m.squads?.away?.season;
  if (HS || AS) {
    group("Bilan de saison · Sofascore");
    h2hRow(grid, t("Matchs sans encaisser"), HS?.clean_sheets, AS?.clean_sheets);
    h2hRow(grid, t("Buts sur penalty"), HS?.penalty_goals, AS?.penalty_goals);
    h2hRow(grid, t("Cartons rouges"), HS?.red_cards, AS?.red_cards);
  }
  card.appendChild(grid);

  // Forebet expose des rubriques qu'il ne renseigne pas pour ce championnat
  // (touches, six mètres, tacles… à 0 ou « - » des deux côtés). Une barre à zéro
  // se lirait comme une mesure réelle : on les nomme au lieu de les tracer.
  const missing = Object.entries(others)
    .filter(([, v]) => {
      const h = num(v.home?.total), a = num(v.away?.total);
      return (h === null || h === 0) && (a === null || a === 0);
    })
    .map(([k]) => t(k).toLowerCase());
  if (missing.length) {
    const note = el("p", "sub", ph("missingHere", missing.join(", ")));
    note.style.margin = "18px 0 0";
    card.appendChild(note);
  }
  return card;
}

/* ---------- statistiques relevées du match ---------- */
/* Tout le reste de la console agrège une saison. Cette carte-là, et elle seule,
   décrit ce qui s'est passé sur le terrain ce soir-là. D'où une carte à part :
   mélangée au comparatif, on confondrait « 33 tirs cette saison » et « 33 tirs
   dans ce match ». */
const STAT_LABELS = {
  goals: "Buts", shots: "Tirs", shots_on: "Tirs cadrés", shots_off: "Tirs non cadrés",
  shots_blocked: "Tirs contrés", shots_inside: "Tirs dans la surface",
  shots_outside: "Tirs hors surface", corners: "Corners", offsides: "Hors-jeu",
  passes: "Passes", passes_accuracy: "Passes réussies (%)", saves: "Arrêts",
  tackles: "Tacles", fouls: "Fautes", yellow: "Cartons jaunes", red: "Cartons rouges",
  substitutions: "Remplacements",
};
const STAT_GROUPS = [
  ["Attaque", ["goals", "shots", "shots_on", "shots_off", "shots_blocked",
               "shots_inside", "shots_outside"]],
  ["Jeu", ["corners", "offsides", "passes", "passes_accuracy", "saves", "tackles"]],
  ["Discipline", ["fouls", "yellow", "red"]],
  ["Divers", ["substitutions"]],
];

function possessionBar(s) {
  const h = num(s.home.possession), a = num(s.away.possession);
  if (h === null || a === null || h + a === 0) return null;
  const box = el("div");
  const values = el("div", "possv");
  values.appendChild(el("span", null, `${h} %`));
  values.appendChild(el("span", null, t("Possession")));
  values.appendChild(el("span", null, `${a} %`));
  const bar = el("div", "poss");
  const left = el("i", "ph"), right = el("i", "pa");
  left.style.width = (h / (h + a) * 100) + "%";
  right.style.width = (a / (h + a) * 100) + "%";
  bar.appendChild(left);
  bar.appendChild(right);
  box.appendChild(values);
  box.appendChild(bar);
  return box;
}

/* Deux chronologies possibles, et une seule affichée.

   Sofascore passe devant parce qu'il **nomme les buteurs** — 187 buts nommés
   sur 195 relevés sur la saison — là où Forebet donne un libellé et un camp,
   jamais un nom. Le repli sur Forebet reste utile : une rencontre trop récente
   pour Sofascore, ou absente de son calendrier, garde une chronologie.

   ⚠️ Le `side` de Sofascore est déjà retourné côté Python (`attach_events`) :
   cette source oriente domicile/extérieur à l'envers des autres. Rien à
   corriger ici, et surtout rien à re-corriger. */
const SOFA_LABEL = {
  "goal/regular": "But", "goal/penalty": "But sur penalty",
  "goal/ownGoal": "But contre son camp", "goal/owngoal": "But contre son camp",
  "card/yellow": "Carton jaune", "card/red": "Carton rouge",
  "card/yellowRed": "Second jaune",
};

function renderTimeline(s, m) {
  const rich = m.timeline && m.timeline.length ? m.timeline : null;
  const plain = s && s.timeline && s.timeline.length ? s.timeline : null;
  if (!rich && !plain) return null;

  const box = el("div");
  box.style.marginTop = "22px";
  box.appendChild(el("div", "grp2", t("Chronologie")));
  const line = el("div", "tline");

  (rich || plain).forEach(e => {
    const chip = el("div", "ev");
    if (e.side) chip.appendChild(el("span", "side " + e.side));
    const extra = rich ? e.added : e.extra;
    chip.appendChild(el("b", null, e.minute + (extra ? "+" + extra : "") + "'"));

    let label;
    if (rich) {
      label = t(SOFA_LABEL[e.type + "/" + e.class] || e.type);
      if (e.type === "card") chip.classList.add("card-ev");
    } else {
      // Le libellé de Forebet arrive en français ; on repart de `type`, neutre.
      label = lang === "en" ? (EVENT_EN[e.type] || e.type.replace(/_/g, " ")) : e.label;
    }
    chip.appendChild(el("span", null, label));

    // Le nom passe en gras : c'est lui qu'on vient chercher dans cette carte.
    if (rich && e.player) chip.appendChild(el("b", "who", e.player));

    const who = e.side ? (e.side === "home" ? m.home : m.away) : null;
    chip.title = [label, e.player, who].filter(Boolean).join(" — ");
    line.appendChild(chip);
  });

  box.appendChild(line);
  // Un but sans buteur, ça arrive : le dire vaut mieux que laisser croire à un
  // oubli d'affichage.
  if (rich && rich.some(e => e.type === "goal" && !e.player)) {
    const p = el("p", "sub", t("La source ne nomme pas tous les buteurs ; " +
      "les buts sans nom sont conservés, le compte reste juste."));
    p.style.margin = "10px 0 0";
    box.appendChild(p);
  }
  return box;
}

function renderMatchStats(m) {
  const s = m.match_stats;
  if (!s) return null;
  const card = el("div", "card");
  card.appendChild(el("h2", null, t("Statistiques du match")));

  if (m.live) {
    const badge = el("span", "badge live", t("en direct"));
    badge.style.marginLeft = "10px";
    card.querySelector("h2").appendChild(badge);
  }

  const meta = ph("matchMeta", s.venue, s.venue_capacity, s.half_time, s.full_time);
  card.appendChild(el("p", "sub", t(
    "Relevé de cette rencontre, pas de la saison — c'est la seule carte de la " +
    "page qui décrit ce match. ") + (meta ? meta + "." : "")));

  // Ce que le direct ne peut pas montrer, dit une fois plutôt que laissé à
  // deviner devant des rubriques qui manquent.
  if (m.live) {
    const p = el("p", "sub", t(
      "Relevé en direct, encore incomplet : la source remplit les rubriques au " +
      "fil du match, et ne publie ni la minute ni les faits de jeu avant la fin."));
    p.style.margin = "8px 0 0";
    card.appendChild(p);
  }
  if (s.unstable) {
    const p = el("p", "sub", t(
      "Score en direct, à confirmer : la source a déjà réattribué un but d'un " +
      "camp à l'autre sur cette rencontre."));
    p.style.margin = "8px 0 0";
    p.style.color = "var(--critical)";
    card.appendChild(p);
  }

  const bar = possessionBar(s);
  if (bar) card.appendChild(bar);

  const grid = el("div", "h2h");
  grid.style.marginTop = "18px";
  grid.dataset.home = m.home;
  grid.dataset.away = m.away;
  let drawn = 0;
  STAT_GROUPS.forEach(([title, keys]) => {
    const present = keys.filter(k => s.fields.includes(k) &&
      (s.home[k] !== null || s.away[k] !== null));
    if (!present.length) return;
    grid.appendChild(el("div", "grp", t(title)));
    present.forEach(k => {
      h2hRow(grid, t(STAT_LABELS[k] || k), s.home[k], s.away[k]);
      drawn++;
    });
  });
  if (drawn) card.appendChild(grid);

  const tl = renderTimeline(s, m);
  if (tl) tl.dataset.source = m.timeline && m.timeline.length ? "sofascore" : "forebet";
  if (tl) card.appendChild(tl);

  // La source sert un zéro pour les rubriques qu'elle ne couvre pas : les taire
  // vaut mieux que d'afficher « 0 faute », mais il faut dire qu'on les tait.
  const absent = Object.keys(STAT_LABELS)
    .filter(k => !s.fields.includes(k))
    .map(k => t(STAT_LABELS[k]).toLowerCase());
  const notes = [];
  if (absent.length) notes.push(ph("notRecorded", absent.join(", ")));
  if (s.attacks && s.attacks.suspect) {
    notes.push(t("Les attaques et attaques dangereuses sont écartées : la source " +
      "en donne plus de dangereuses que de totales, le compte est faux."));
  } else if (s.attacks) {
    notes.push(ph("attacksLine", s.attacks));
  }
  notes.forEach(text => {
    const p = el("p", "sub", text);
    p.style.margin = "16px 0 0";
    card.appendChild(p);
  });
  return card;
}

/* ---------- effectifs ---------- */
/* Seule carte alimentée par Sofascore : Forebet laisse `lineup` et `bench`
   vides sur cette division. Ce ne sont PAS des compositions — personne n'en
   publie pour ce championnat — mais les effectifs de la saison. La carte le
   dit, pour qu'on ne lise pas « 33 joueurs » comme un onze de départ. */
const POS_ORDER = ["G", "D", "M", "F"];
const POS_LABEL = {
  fr: { G: "Gardiens", D: "Défenseurs", M: "Milieux", F: "Attaquants", "?": "Poste inconnu" },
  en: { G: "Goalkeepers", D: "Defenders", M: "Midfielders", F: "Forwards", "?": "Position unknown" },
};

function squadColumn(side, name, squad, bench) {
  const col = el("div");
  const head = el("div", "sqhead");
  head.appendChild(el("span", "dot " + side));
  head.appendChild(teamLabel(name));
  col.appendChild(head);

  const bits = [ph("squadCount", squad.players.length)];
  if (squad.manager) bits.push(ph("coach", squad.manager));
  col.appendChild(el("div", "sqmeta", bits.join(" · ")));

  // L'entraîneur ci-dessus est celui du club AUJOURD'HUI ; celui-ci était sur
  // le banc ce soir-là. On ne l'affiche que s'ils diffèrent — sinon c'est la
  // même ligne écrite deux fois.
  if (bench && bench !== squad.manager) {
    col.appendChild(el("div", "sqmeta", t("Sur le banc") + " : " + bench));
  }

  const groups = {};
  squad.players.forEach(p => {
    const k = POS_ORDER.includes(p.position) ? p.position : "?";
    (groups[k] = groups[k] || []).push(p);
  });
  [...POS_ORDER, "?"].forEach(k => {
    const list = groups[k];
    if (!list) return;
    col.appendChild(el("div", "sqgrp", POS_LABEL[lang][k]));
    list.forEach(p => {
      const row = el("div", "pl");
      row.appendChild(el("span", "no", p.number || "—"));
      const nom = el("span", "nom", p.name || "?");
      if (p.country) nom.title = p.country;
      row.appendChild(nom);
      if (p.country_code) row.appendChild(el("span", "nat", p.country_code));
      // Les buts sont la SEULE statistique individuelle que la source
      // renseigne ici : ni minutes, ni passes décisives, ni notes.
      if (p.goals) row.appendChild(el("span", "bu", ph("goalCount", p.goals)));
      col.appendChild(row);
    });
  });
  return col;
}

function renderSquads(m) {
  const s = m.squads || {};
  if (!s.home && !s.away) return null;
  const card = el("div", "card");
  card.appendChild(el("h2", null, t("Effectifs")));
  card.appendChild(el("p", "sub", t(
    "Effectifs de la saison, pas les compositions du jour : aucune source ne " +
    "publie de feuille de match pour ce championnat. Les buts sont la seule " +
    "statistique individuelle disponible. Source : Sofascore.")));

  const grid = el("div", "squad");
  [["home", m.home, s.home], ["away", m.away, s.away]].forEach(([side, name, sq]) => {
    if (sq && sq.players && sq.players.length) {
      grid.appendChild(squadColumn(side, name, sq, (m.managers || {})[side]));
    } else {
      const col = el("div");
      const head = el("div", "sqhead");
      head.appendChild(el("span", "dot " + side));
      head.appendChild(teamLabel(name));
      col.appendChild(head);
      col.appendChild(el("div", "sqmeta", t("effectif non récupéré")));
      grid.appendChild(col);
    }
  });
  card.appendChild(grid);
  return card;
}

/* ---------- parcours : buts marqués / encaissés par match ---------- */
function ownGoals(row) {
  if (row.home_goals === null || row.subject_side === null) return null;
  return row.subject_side === "home"
    ? { own: row.home_goals, opp: row.away_goals, versus: row.away, at: "domicile" }
    : { own: row.away_goals, opp: row.home_goals, versus: row.home, at: "extérieur" };
}

function goalChart(rows, side, scale) {
  // Ordre chronologique : la source liste du plus récent au plus ancien.
  const seq = rows.slice().reverse().map(r => ({ r, g: ownGoals(r) })).filter(x => x.g);
  const wrap = el("div", "gwrap");
  const chart = el("div", "gchart");
  seq.forEach(({ r, g }) => {
    const col = el("div", "gcol");
    col.title = `${r.date} · ${r.home} ${r.score} ${r.away} (${r.competition})`;
    const up = el("div", "up");
    const a = el("i");
    a.style.height = (g.own / scale * 100) + "%";
    a.style.background = `var(--${side})`;
    up.appendChild(a);
    const dn = el("div", "dn");
    const b = el("i");
    b.style.height = (g.opp / scale * 100) + "%";
    dn.appendChild(b);
    col.appendChild(up);
    col.appendChild(dn);
    chart.appendChild(col);
  });
  wrap.appendChild(chart);
  wrap.appendChild(el("div", "baseline"));
  const axis = el("div", "gaxis");
  axis.appendChild(el("span", null, t("plus ancien")));
  axis.appendChild(el("span", null, ph("chartScale", scale)));
  axis.appendChild(el("span", null, t("plus récent")));
  wrap.appendChild(axis);
  return wrap;
}

function matchTable(rows) {
  const scroll = el("div", "scroll");
  // La table s'appelait `t` : renommée, sinon elle masque la fonction de
  // traduction dans tout le corps de la fonction.
  const table = el("table");
  const head = el("thead");
  const hr = el("tr");
  [["l", "Date"], ["l", "Domicile"], [null, "Score"], ["l", "Extérieur"], ["l", "Compét."]]
    .forEach(([cls, label]) => hr.appendChild(el("th", cls, t(label))));
  head.appendChild(hr);
  table.appendChild(head);
  const tb = el("tbody");
  rows.forEach(mt => {
    const tr = el("tr");
    tr.appendChild(el("td", "l", mt.date || "—"));
    tr.appendChild(el("td", "l", mt.home));
    tr.appendChild(el("td", null, mt.score || "—"));
    tr.appendChild(el("td", "l", mt.away));
    tr.appendChild(el("td", "l", mt.competition || "—"));
    tb.appendChild(tr);
  });
  table.appendChild(tb);
  scroll.appendChild(table);
  return scroll;
}

function formChips(form) {
  const box = el("div", "form");
  // La classe reste la lettre d'origine (V/N/D) : c'est elle qui porte la
  // couleur. Seul l'affichage bascule en W/D/L.
  [...(form || "")].forEach(ch => box.appendChild(el("span", ch, formLetter(ch))));
  return box;
}

function renderRuns(m) {
  const card = el("div", "card");
  card.appendChild(el("h2", null, t("Parcours")));
  card.appendChild(el("p", "sub", t(
    "Un trait par match, du plus ancien au plus récent : au-dessus de la ligne " +
    "les buts marqués, en dessous les buts encaissés. Les deux équipes partagent " +
    "la même échelle, donc les hauteurs sont comparables d'un graphique à l'autre. " +
    "Bilans recalculés depuis les résultats — Forebet rend ses pourcentages en " +
    "JavaScript et les laisse vides dans le HTML.")));

  const blocks = [[1, "home", m.home], [2, "away", m.away]]
    .map(([i, side, name]) => ({ b: block(m, i), side, name }))
    .filter(x => x.b);

  // Échelle commune : deux graphiques mis à l'échelle séparément se
  // compareraient à tort.
  let scale = 1;
  blocks.forEach(({ b }) => b.matches.forEach(r => {
    const g = ownGoals(r);
    if (g) scale = Math.max(scale, g.own, g.opp);
  }));

  const legend = el("div", "keys");
  legend.style.marginBottom = "18px";
  // Deux pastilles pour « marqués » : la barre porte la couleur de son équipe,
  // un seul échantillon en désignerait une et pas l'autre.
  const k1 = el("div", "key");
  ["home", "away"].forEach(side => {
    const s = el("span", "swatch");
    s.style.background = `var(--${side})`;
    s.style.marginRight = "-3px";
    k1.appendChild(s);
  });
  k1.appendChild(el("span", null, t("buts marqués (au-dessus)")));
  const k2 = el("div", "key");
  const s2 = el("span", "swatch");
  s2.style.background = "var(--muted-bar)";
  k2.appendChild(s2);
  k2.appendChild(el("span", null, t("buts encaissés (en dessous)")));
  legend.appendChild(k1);
  legend.appendChild(k2);
  card.appendChild(legend);

  blocks.forEach(({ b, side, name }) => {
    const sec = el("div");
    sec.style.marginBottom = "24px";
    const head = el("div", "teamhead");
    const tt = el("div", "tt");
    tt.style.display = "flex";
    tt.style.alignItems = "center";
    tt.style.gap = "8px";
    tt.appendChild(el("span", "dot " + side));
    tt.appendChild(teamLabel(name));
    head.appendChild(tt);
    const right = el("div", "teamhead");
    right.style.gap = "12px";
    const r = b.record;
    right.appendChild(el("div", "tr2", ph("record", r)));
    right.appendChild(formChips(b.form));
    head.appendChild(right);
    sec.appendChild(head);
    sec.appendChild(goalChart(b.matches, side, scale));
    const det = el("details");
    det.appendChild(el("summary", null, ph("seeMatches", b.matches.length)));
    det.appendChild(matchTable(b.matches));
    sec.appendChild(det);
    card.appendChild(sec);
  });
  return card;
}

/* ---------- contexte : domicile / extérieur / face à face ---------- */
function renderContext(m) {
  const card = el("div", "card");
  card.appendChild(el("h2", null, t("Contexte de la rencontre")));
  card.appendChild(el("p", "sub", t(
    "Les deux bilans qui concernent directement cette affiche — l'équipe qui " +
    "reçoit à domicile, celle qui se déplace à l'extérieur — puis leurs " +
    "confrontations passées.")));

  const split = el("div", "split");
  [[3, "home"], [4, "away"]].forEach(([i, side]) => {
    const b = block(m, i);
    if (!b) return;
    const col = el("div");
    const head = el("div", "teamhead");
    const tt = el("div", "tt");
    tt.appendChild(el("span", "dot " + side));
    // `display_title` est composé en français par build_console.py. On le
    // recompose ici à partir du nom de l'équipe, pour qu'il suive la langue.
    tt.appendChild(document.createTextNode(
      " " + ph("venueTitle", side === "home" ? m.home : m.away, side)));
    head.appendChild(tt);
    col.appendChild(head);
    const r = b.record;
    col.appendChild(el("div", "tr2", ph("record", r)));
    const f = el("div");
    f.style.marginTop = "8px";
    f.appendChild(formChips(b.form));
    col.appendChild(f);
    const det = el("details");
    det.appendChild(el("summary", null, ph("seeMatches", b.matches.length)));
    det.appendChild(matchTable(b.matches));
    col.appendChild(det);
    split.appendChild(col);
  });
  card.appendChild(split);

  const h2h = block(m, 0);
  if (h2h && h2h.matches.length) {
    const sec = el("div");
    sec.style.marginTop = "24px";
    sec.style.borderTop = "1px solid var(--grid)";
    sec.style.paddingTop = "16px";
    const head = el("div", "teamhead");
    head.appendChild(el("div", "tt", t("Face à face")));
    const r = h2h.record;
    // Le bilan du face à face est celui d'UNE des deux équipes (celle que la
    // source marque `active-team`). Sans le nom, on l'attribue spontanément à
    // l'équipe qui reçoit — l'inverse de la vérité dans notre match de test.
    head.appendChild(el("div", "tr2", h2h.subject
      ? ph("h2hSeenBy", h2h.subject, r)
      : ph("playedOnly", r)));
    sec.appendChild(head);
    sec.appendChild(matchTable(h2h.matches));
    card.appendChild(sec);
  }
  return card;
}

/* ---------- classement (panneau latéral) ---------- */
function renderStandings(m) {
  const card = el("div", "card");
  card.appendChild(el("h2", null, t("Classement")));
  card.appendChild(el("p", "sub", t(
    "Les deux équipes de la rencontre sont surlignées. Le championnat koweïtien " +
    "départage à la confrontation directe, pas à la différence de buts.")));

  const rows = m.standings || [];
  // Renommée : `t` était la table, et masquait la fonction de traduction.
  const table = el("table", "mini");
  const head = el("thead");
  const hr = el("tr");
  [["r", ""], ["t", t("Équipe")], ["", lang === "en" ? "P" : "J"], ["p", "Pts"], ["d", "+/-"]]
    .forEach(([cls, label]) => hr.appendChild(el("td", cls, label)));
  head.appendChild(hr);
  table.appendChild(head);

  const tb = el("tbody");
  rows.forEach(row => {
    const tr = el("tr");
    if (row.team === m.home) tr.className = "mark-home";
    if (row.team === m.away) tr.className = "mark-away";

    tr.appendChild(el("td", "r", row.rank));

    const td = el("td", "t");
    const wrap = el("span");
    const crest = crestOf(row.team, "sm");
    if (crest) wrap.appendChild(crest);
    const nm = el("span", "nm", row.team);
    nm.title = row.team;
    wrap.appendChild(nm);
    td.appendChild(wrap);
    tr.appendChild(td);

    tr.appendChild(el("td", null, row.played));
    tr.appendChild(el("td", "p", row.points));
    tr.appendChild(el("td", "d", row.goal_diff > 0 ? "+" + row.goal_diff : row.goal_diff));
    tb.appendChild(tr);
  });
  table.appendChild(tb);
  card.appendChild(table);

  // Le panneau est étroit : le détail complet reste accessible, replié.
  const det = el("details");
  det.appendChild(el("summary", null, t("détail V/N/D et buts")));
  const scroll = el("div", "scroll");
  const full = el("table");
  const fhead = el("thead");
  const fhr = el("tr");
  const cols = lang === "en"
    ? ["#", "Team", "W", "D", "L", "GF", "GA"]
    : ["#", "Équipe", "V", "N", "D", "BP", "BC"];
  cols.forEach((label, i) => fhr.appendChild(el("th", i === 1 ? "l" : null, label)));
  fhead.appendChild(fhr);
  full.appendChild(fhead);
  const ftb = el("tbody");
  rows.forEach(row => {
    const tr = el("tr");
    if (row.team === m.home) tr.className = "mark-home";
    if (row.team === m.away) tr.className = "mark-away";
    ["rank", "team", "wins", "draws", "losses", "goals_for", "goals_against"]
      .forEach(k => tr.appendChild(el("td", k === "team" ? "l" : null, row[k])));
    ftb.appendChild(tr);
  });
  full.appendChild(ftb);
  scroll.appendChild(full);
  det.appendChild(scroll);
  card.appendChild(det);

  return card;
}

/* ---------- générateur de prompt Instagram ---------- */
/* Ce bloc suit `promptLang`, pas `lang` : le carrousel est du contenu éditorial
   destiné au compte de Haris. Sa langue est un choix de publication, elle n'a
   pas à basculer parce qu'un visiteur arrive avec un navigateur anglais. D'où
   le bouton séparé dans la barre du haut. */
const ordinal = n => promptLang === "en" ? ordinalEn(n) : (n === 1 ? "1re" : n + "e");
const PR = {
  attackBest: { fr: "meilleure attaque de la division", en: "best attack in the division" },
  attackWorst: { fr: "pire attaque de la division", en: "worst attack in the division" },
  attackNth: { fr: "attaque", en: "attack" },
  defenceBest: { fr: "meilleure défense de la division", en: "best defence in the division" },
  defenceWorst: { fr: "pire défense de la division", en: "worst defence in the division" },
  defenceNth: { fr: "défense", en: "defence" },
  atHome: { fr: "à domicile", en: "at home" },
  away: { fr: "à l'extérieur", en: "away" },
};
const pr = key => PR[key][promptLang];

function rankMap(standings, key, bestIsHigh) {
  // Rang de chaque équipe sur une métrique, pour pouvoir écrire « pire défense
  // de D1 » ou « 2e meilleure attaque » plutôt qu'un nombre nu.
  const sorted = [...standings].sort((a, b) =>
    bestIsHigh ? b[key] - a[key] : a[key] - b[key]);
  const map = {};
  sorted.forEach((row, i) => { map[row.team] = i + 1; });
  return map;
}

function teamFacts(m, side) {
  const name = side === "home" ? m.home : m.away;
  const st = rowOf(m, name) || {};
  const stats = (m.stats || {})[side] || {};
  const runs = block(m, side === "home" ? 1 : 2);
  const venue = block(m, side === "home" ? 3 : 4);
  const table = m.standings || [];
  const n = table.length;

  const atk = rankMap(table, "goals_for", true)[name];
  const def = rankMap(table, "goals_against", false)[name];
  const cs = (m.stats?.others || {})["Aucun but encaissé"];

  const attackNote = atk === 1 ? pr("attackBest")
    : atk === n ? pr("attackWorst") : `${ordinal(atk)} ${pr("attackNth")}`;
  const defenseNote = def === 1 ? pr("defenceBest")
    : def === n ? pr("defenceWorst") : `${ordinal(def)} ${pr("defenceNth")}`;

  const rec = runs?.record_recent;
  const winRate6 = rec && rec.played ? Math.round(rec.wins / rec.played * 100) : null;

  return {
    name, side, st, stats, runs, venue,
    rank: st.rank, points: st.points, played: st.played,
    wins: st.wins, draws: st.draws, losses: st.losses,
    scored: st.goals_for, conceded: st.goals_against, diff: st.goal_diff,
    attackNote, defenseNote,
    scoredAvg: stats.goals?.scored_avg, concededAvg: stats.goals?.conceded_avg,
    shots: stats.shots?.total, shotsAvg: stats.shots?.total_avg,
    dangerous: stats.attacks?.dangerous, dangerousAvg: stats.attacks?.dangerous_avg,
    cleanSheets: cs ? cs[side]?.total : null,
    form: runs?.form || "", winRate6,
    venueLabel: side === "home" ? pr("atHome") : pr("away"),
    venueRecord: venue?.record || null,
  };
}

function suggestedLines(m, H, A) {
  const en = promptLang === "en";
  const lines = [];
  const gap = (A.points ?? 0) - (H.points ?? 0);
  if (Number.isFinite(gap) && gap !== 0) {
    const lead = gap > 0 ? A : H;
    lines.push(en
      ? `${Math.abs(gap)} PTS APART — ${lead.name.toUpperCase()} AHEAD`
      : `${Math.abs(gap)} PTS D'ÉCART — avantage ${lead.name.toUpperCase()}`);
  }
  // Le paramètre s'appelait `t` : il masquait la fonction de traduction.
  [H, A].forEach(team => {
    if (team.venueRecord && team.venueRecord.played) {
      const v = team.venueRecord;
      lines.push(en
        ? `${v.wins}/${v.played} WINS ${team.venueLabel.toUpperCase()} — ${team.name.toUpperCase()}`
        : `${v.wins}/${v.played} VICTOIRES ${team.venueLabel.toUpperCase()} — ${team.name.toUpperCase()}`);
    }
  });
  const pair = `${H.name.toUpperCase()} / ${A.name.toUpperCase()}`;
  if (H.shotsAvg != null && A.shotsAvg != null) {
    lines.push(`${H.shotsAvg} / ${A.shotsAvg} ` +
      (en ? `SHOTS PER MATCH — ${pair}` : `TIRS PAR MATCH — ${pair}`));
  }
  if (H.concededAvg != null && A.concededAvg != null) {
    lines.push(`${H.concededAvg} / ${A.concededAvg} ` +
      (en ? `GOALS CONCEDED PER MATCH — ${pair}` : `BUTS ENCAISSÉS PAR MATCH — ${pair}`));
  }
  if (H.winRate6 != null && A.winRate6 != null) {
    lines.push(`${H.winRate6}% / ${A.winRate6}% ` +
      (en ? `WIN RATE OVER 6 MATCHES — ${pair}` : `DE VICTOIRES SUR 6 MATCHS — ${pair}`));
  }
  const h2h = block(m, 0);
  if (h2h && h2h.record.played && h2h.subject) {
    const r = h2h.record;
    lines.push(en
      ? `${r.wins}/${r.played} MEETINGS WON — ${h2h.subject.toUpperCase()}`
      : `${r.wins}/${r.played} CONFRONTATIONS GAGNÉES — ${h2h.subject.toUpperCase()}`);
  }
  return lines;
}

function teamBlockText(f) {
  const v = f.venueRecord;
  const dash = "—";
  if (promptLang === "en") {
    return [
      `${f.name} — ${f.side === "home" ? "hosts" : "travels"}`,
      `  Table           ${ordinalEn(f.rank)} in the division, ${f.points} pts from ${f.played} matches`,
      `  Record          ${f.wins}W ${f.draws}D ${f.losses}L`,
      `  Goals           ${f.scored} scored (${f.attackNote}), ${f.conceded} conceded (${f.defenseNote})`,
      `  Difference      ${f.diff > 0 ? "+" + f.diff : f.diff}`,
      `  Averages        ${f.scoredAvg ?? dash} scored / ${f.concededAvg ?? dash} conceded per match`,
      `  Shots           ${f.shots ?? dash} in total, ${f.shotsAvg ?? dash} per match`,
      `  Dangerous att.  ${f.dangerous ?? dash} in total, ${f.dangerousAvg ?? dash} per match`,
      `  Clean sheets    ${f.cleanSheets ?? dash}`,
      `  Form (last 6)   ${f.form || dash}  (newest to oldest)`,
      v ? `  ${f.venueLabel.padEnd(15)} ${v.wins}W ${v.draws}D ${v.losses}L from ${v.played} matches, ${v.goals_for}:${v.goals_against}` : "",
    ].filter(Boolean).join("\n");
  }
  return [
    `${f.name} — ${f.side === "home" ? "reçoit" : "se déplace"}`,
    `  Classement      ${f.rank}e de la division, ${f.points} pts en ${f.played} matchs`,
    `  Bilan           ${f.wins}V ${f.draws}N ${f.losses}D`,
    `  Buts            ${f.scored} marqués (${f.attackNote}), ${f.conceded} encaissés (${f.defenseNote})`,
    `  Différence      ${f.diff > 0 ? "+" + f.diff : f.diff}`,
    `  Moyennes        ${f.scoredAvg ?? dash} marqués / ${f.concededAvg ?? dash} encaissés par match`,
    `  Tirs            ${f.shots ?? dash} au total, ${f.shotsAvg ?? dash} par match`,
    `  Attaques dang.  ${f.dangerous ?? dash} au total, ${f.dangerousAvg ?? dash} par match`,
    `  Clean sheets    ${f.cleanSheets ?? dash}`,
    `  Forme (6 der.)  ${f.form || dash}  (du plus récent au plus ancien)`,
    v ? `  ${f.venueLabel.padEnd(15)} ${v.wins}V ${v.draws}N ${v.losses}D sur ${v.played} matchs, ${v.goals_for}:${v.goals_against}` : "",
  ].filter(Boolean).join("\n");
}

/* Relevé du match pour le brief. Les rubriques non couvertes sont omises et non
   mises à zéro : un « 0 faute » dans un brief finirait imprimé sur une slide. */
function matchStatsText(m) {
  const s = m.match_stats;
  if (!s) return "";
  const en = promptLang === "en";
  // Les libellés du brief suivent la langue du brief, pas celle de l'interface.
  const label = k => (en ? (EN[STAT_LABELS[k]] ?? STAT_LABELS[k]) : STAT_LABELS[k]) || k;
  const rows = [];
  if (s.home.possession !== null && s.home.possession !== undefined) {
    rows.push(`  ${(en ? "Possession" : "Possession").padEnd(15)} ${s.home.possession} % / ${s.away.possession} %`);
  }
  STAT_GROUPS.forEach(([, keys]) => keys.forEach(k => {
    if (k === "goals" || !s.fields.includes(k)) return;
    if (s.home[k] === null && s.away[k] === null) return;
    rows.push(`  ${label(k).padEnd(15)} ${s.home[k]} / ${s.away[k]}`);
  }));
  // Sofascore d'abord : un carrousel qui nomme les buteurs vaut mieux qu'un
  // carrousel qui dit « 87' Al Jazira ». Repli sur Forebet, qui date les buts
  // sans jamais les attribuer à quelqu'un.
  const rich = (m.timeline || []).filter(e => e.type === "goal");
  const goals = rich.length
    ? rich
    : (s.timeline || []).filter(e => e.type === "goal" || e.type === "owngoal");
  const scorers = goals.map(g => {
    const when = g.minute + (rich.length && g.added ? "+" + g.added : "") + "'";
    const club = g.side === "home" ? m.home : m.away;
    const who = rich.length && g.player ? ` ${g.player} (${club})` : ` ${club}`;
    const how = rich.length && g.class === "penalty" ? (en ? " pen." : " pén.")
      : rich.length && g.class === "ownGoal" ? (en ? " o.g." : " c.s.c.") : "";
    return when + who + how;
  }).join(", ");
  if (en) {
    return [
      `Statistics recorded for THIS fixture (${m.home} / ${m.away})`,
      s.full_time ? `  Full-time       ${s.full_time}${s.half_time ? ` (half-time ${s.half_time})` : ""}` : "",
      s.venue ? `  Venue           ${s.venue}` : "",
      ...rows,
      goals.length ? `  Goals           ${scorers}` : "",
      s.attacks && !s.attacks.suspect
        ? `  Attacks         ${s.attacks.home.total} / ${s.attacks.away.total} (dangerous ${s.attacks.home.dangerous} / ${s.attacks.away.dangerous})`
        : "",
    ].filter(Boolean).join("\n");
  }
  return [
    `Statistiques relevées de CETTE rencontre (${m.home} / ${m.away})`,
    s.full_time ? `  Score final     ${s.full_time}${s.half_time ? ` (mi-temps ${s.half_time})` : ""}` : "",
    s.venue ? `  Stade           ${s.venue}` : "",
    ...rows,
    goals.length ? `  Buts            ${scorers}` : "",
    s.attacks && !s.attacks.suspect
      ? `  Attaques        ${s.attacks.home.total} / ${s.attacks.away.total} (dangereuses ${s.attacks.home.dangerous} / ${s.attacks.away.dangerous})`
      : "",
  ].filter(Boolean).join("\n");
}

function buildPrompt(m) {
  const H = teamFacts(m, "home"), A = teamFacts(m, "away");
  const pal = m.palette || {};
  const table = m.standings || [];
  // La journée vient de Sofascore quand il la connaît : c'est un chiffre relevé,
  // pas déduit. Sinon on retombe sur la déduction par le nombre de matchs joués,
  // valable seulement si toutes les équipes en ont disputé autant.
  const played = [...new Set(table.map(r => r.played))];
  const matchday = m.round || (played.length === 1 ? played[0] + 1 : null);
  const date = (m.kickoff || "").split(" ")[0];
  return promptLang === "en"
    ? promptEn(m, H, A, pal, table, matchday, date)
    : promptFr(m, H, A, pal, table, matchday, date);
}

/* Les deux briefs sont écrits en entier, pas assemblés à partir de fragments
   traduits : c'est un texte de direction artistique, il doit se lire comme tel
   dans les deux langues. Les valeurs, elles, sont les mêmes des deux côtés. */
function promptEn(m, H, A, pal, table, matchday, date) {
  const comp = (m.competition_tag === "KW2" ? "KUWAIT DIVISION 1" : m.competition_tag || "").toUpperCase();
  const homeInk = pal.home_ink === "sombre" ? "dark ink #14161a" : "white";
  const awayInk = pal.away_ink === "sombre" ? "dark ink #14161a" : "white";
  const homeCol = pal.home || "#1d5285", awayCol = pal.away || "#9c8552";

  return `You are an art director. Build a 4-slide Instagram carousel for the fixture
below. Every figure is supplied: invent none, compute no prediction, forecast no
score. The subject is what both teams have recorded.

DELIVERABLE
One self-contained HTML page (no external asset, no external font), 4 stacked
sections. Each slide is exactly 1080 x 1350 px, 4:5 ratio, designed for a 2x
export (2160 x 2700). No internal scrolling, nothing overflowing.

TYPOGRAPHY

- Labels: a monospace in capitals, wide tracking (~0.2em), small.
- No serif face, no decorative script.

PALETTE — both clubs' colours, taken from their crests
- ${H.name}: ${homeCol}${pal.home_alt ? "  (secondary " + pal.home_alt + ")" : ""}
  Text to lay over it: ${homeInk}.
- ${A.name}: ${awayCol}${pal.away_alt ? "  (secondary " + pal.away_alt + ")" : ""}
  Text to lay over it: ${awayInk}.
${pal.clash ? `WARNING: both clubs play in the same hue (${A.name} is really
${pal.away_true}). So that the two sides stay tellable apart, the value given
above for ${A.name} is its darkened colour: same hue, shifted lightness. Use it
as given, and carry the distinction on the crests and the layout rather than on
colour alone.
` : ""}- Night         #0d1626   (background of the cover and of slide 4)
- Alert orange  #f2703f   (only for a negative figure or a record suffered)

Absolute rule: ${H.name} always wears ${homeCol} and ${A.name} always
${awayCol}, across all 4 slides. Colour follows the club, never its position nor
the fact that it is hosting. Invent no other team colour: if a gradient is
needed, derive it from the club's own colour, lighter and darker.

SLIDE 01 — COVER
Background split on the diagonal: ${homeCol} on the left (${H.name}),
${awayCol} on the right (${A.name}), black edge down the middle.
Header: "${comp}" on the left, "01 / 04" on the right, rule under the header.${matchday ? `
White pill: "MATCHDAY ${matchday}".` : ""}
Date aligned right: ${date || "—"}.${m.broadcast && m.broadcast.confirmed ? `
Under the date, in discreet monospace: "LIVE ON ${m.broadcast.channel.toUpperCase()}".` : ""}
${H.name} in very large type, aligned left, in ${pal.home_ink === "sombre" ? "dark ink" : "white"}.
Round "VS" pill with a horizontal rule.

Slide footer: on the left "HOME · ${ordinalEn(H.rank).toUpperCase()}" then ${H.points} PTS;
on the right "AWAY · ${ordinalEn(A.rank).toUpperCase()}" then ${A.points} PTS.

SLIDE 02 — ${A.name.toUpperCase()} (the visitors)
Background ${awayCol} as a gradient (that same colour, lighter and darker),

arcs as hairlines. Header "THE VISITORS" / "02 / 04".
Team name in very large type over two lines.
Main block: ${A.points} huge + "PTS", beside it "${ordinalEn(A.rank).toUpperCase()}" / "IN THE TABLE",
then three square pills ${A.wins}W (filled) ${A.draws}D ${A.losses}L (outlined).
A band of three figures separated by vertical rules:
  ${A.scored} SCORED (${A.attackNote}) | ${A.conceded} CONCEDED | ${A.diff > 0 ? "+" + A.diff : A.diff} DIFFERENCE

SLIDE 03 — ${H.name.toUpperCase()} (the hosts)
Same composition as slide 02, background ${homeCol} as a gradient,
text in ${pal.home_ink === "sombre" ? "dark ink" : "white"}.
Header "THE HOSTS" / "03 / 04".
  ${H.points} PTS · ${ordinalEn(H.rank).toUpperCase()} · ${H.wins}W ${H.draws}D ${H.losses}L
  ${H.scored} SCORED | ${H.conceded} CONCEDED (${H.defenseNote}) | ${H.diff > 0 ? "+" + H.diff : H.diff} DIFFERENCE
Set in alert orange #f2703f any figure that is a record suffered (losses, goals
conceded, negative difference) and add the wording under the figure.

SLIDE 04 — THE NUMBERS
Night background #0d1626, vertical ${awayCol} rule on the right edge.
Header "${comp}" / "04 / 04".
Title over two lines: "THE NUMBERS THAT COUNT", underlined by two short strokes,
one ${homeCol} and one ${awayCol}.
Then a list of rows: the figure on the left in very large type, coloured after
the club it speaks of — ${homeCol} for ${H.name}, ${awayCol} for ${A.name},
white when the row speaks of both. On this dark background, lighten the club
colour just enough to keep it legible, without changing its hue. Label on the
right in monospace, hairline rule between rows.
Rows to compose:
${suggestedLines(m, H, A).map(l => "  - " + l).join("\n")}

FULL DATA

${teamBlockText(H)}

${teamBlockText(A)}

Division table:
${table.map(r => `  ${String(r.rank).padStart(2)}. ${r.team.padEnd(16)} ${String(r.points).padStart(3)} pts  ${r.played}p  ${r.wins}W ${r.draws}D ${r.losses}L  ${r.goals_for}:${r.goals_against}`).join("\n")}
${m.match_stats ? `
${matchStatsText(m)}

Those figures describe the fixture itself, not the season: do not mix them with
the season totals above, and label them plainly ("in this match"). Categories
absent from that list are not zero, they are simply not recorded: do not mention
them.
` : ""}
Final constraint: every figure shown must come from this brief. If a slide feels
empty, drop a row rather than invent a statistic.`;
}

SLIDE 01 — COUVERTURE
Fond partagé en diagonale : ${pal.home || "#1d5285"} à gauche (${H.name}),

En-tête : "${(m.competition_tag === "KW2" ? "KUWAIT DIVISION 1" : m.competition_tag || "").toUpperCase()}" à gauche, "01 / 04" à droite, filet sous l'en-tête.${matchday ? `

Nom de ${H.name} en très gros, aligné à gauche, en ${pal.home_ink === "sombre" ? "encre sombre" : "blanc"}.
Pastille ronde "VS" avec un filet horizontal.
Nom de ${A.name} en très gros, aligné à droite, en ${pal.away_ink === "sombre" ? "encre sombre" : "blanc"}.
